services:
  db:
    image: ankane/pgvector:latest
    container_name: akriti_postgres_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: akriti_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akriti_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: akriti_redis_cache
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  whatsapp:
    build:
      context: .
      dockerfile: WHATSAPP/Dockerfile
    container_name: akriti_whatsapp_service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - WHATSAPP_SERVICE_PORT=3001
      - WHATSAPP_SERVICE_HOST=0.0.0.0
      - WHATSAPP_SESSION_PATH=WHATSAPP/session
      - WHATSAPP_ENABLED=true
    volumes:
      - ./WHATSAPP/session:/app/WHATSAPP/session
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akriti_web_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - WORKERS=${WORKERS:-2}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - WHATSAPP_SERVICE_URL=http://whatsapp:3001
      - START_INTERNAL_WHATSAPP=false
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "main.py"]
    volumes:
      - .:/app
      - /app/venv/
      - /app/.venv/
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      whatsapp:
        condition: service_started
        required: false

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local

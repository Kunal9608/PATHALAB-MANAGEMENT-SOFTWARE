<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Attendance Kiosk — Akriti Diagnostics Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/skeleton.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: #0D1A17;
      color: #E8F4F0;
      font-family: 'Inter', sans-serif;
    }

    .kiosk-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      gap: 32px;
    }

    .kiosk-header {
      text-align: center;
    }

    .kiosk-brand {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: rgba(232, 244, 240, 0.6);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 4px 0;
    }

    .kiosk-subtitle {
      font-size: 13px;
      color: rgba(232, 244, 240, 0.35);
      letter-spacing: 0.06em;
    }

    .kiosk-camera-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scanning ring */
    .scanning-ring-outer {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 2px solid rgba(154, 0, 2, 0.25);
      animation: ring-pulse 2s ease-in-out infinite;
      pointer-events: none;
    }

    .scanning-ring-inner {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 2.5px solid rgba(154, 0, 2, 0.4);
      animation: ring-pulse 2s ease-in-out infinite reverse;
      pointer-events: none;
    }

    .scanning-arc {
      position: absolute;
      width: 354px;
      height: 354px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #9A0002;
      border-right-color: rgba(154, 0, 2, 0.4);
      animation: arc-spin 1.8s linear infinite;
      pointer-events: none;
    }

    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.04); opacity: 0.6; }
    }

    @keyframes arc-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .kiosk-video-wrap {
      position: relative;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(154, 0, 2, 0.5);
      box-shadow: 0 0 80px rgba(154, 0, 2, 0.15), 0 0 40px rgba(0,0,0,0.6);
      background: #0a1210;
    }

    .kiosk-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .kiosk-video-wrap canvas {
      display: none;
    }

    /* Status display */
    .kiosk-status {
      text-align: center;
      min-height: 80px;
    }

    .status-main {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 600;
      color: rgba(232, 244, 240, 0.9);
      margin-bottom: 6px;
    }

    .status-main.recognized {
      color: #4CAF7D;
    }

    .status-main.failed {
      color: #E05B5B;
    }

    .status-sub {
      font-size: 13px;
      color: rgba(232, 244, 240, 0.4);
    }

    /* Recent log */
    .kiosk-log-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px 24px;
      width: 360px;
      max-width: 100%;
    }

    .kiosk-log-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(232,244,240,0.3);
      margin-bottom: 14px;
    }

    .kiosk-log-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .kiosk-log-item:last-child { border-bottom: none; }

    .kiosk-log-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF7D;
      flex-shrink: 0;
    }

    .kiosk-log-name { font-weight: 600; font-size: 14px; color: rgba(232,244,240,0.85); }
    .kiosk-log-time { font-size: 12px; color: rgba(232,244,240,0.3); margin-top: 1px; }

    /* Offline banner (kiosk variant) */
    .kiosk-offline {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(220, 80, 80, 0.9);
      color: #fff;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 100;
    }

    .kiosk-offline.show { display: block; }

    /* Buttons */
    .kiosk-actions {
      display: flex;
      gap: 12px;
    }

    .kiosk-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .kiosk-btn-primary {
      background: #9A0002;
      color: #fff;
    }

    .kiosk-btn-primary:hover { background: #b50003; }
    .kiosk-btn-primary:disabled { background: rgba(154,0,2,0.3); cursor: not-allowed; }

    .kiosk-btn-ghost {
      background: rgba(255,255,255,0.06);
      color: rgba(232,244,240,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .kiosk-btn-ghost:hover { background: rgba(255,255,255,0.1); }

    /* Success flash */
    @keyframes flash-success {
      0%   { box-shadow: 0 0 80px rgba(154,0,2,0.15), 0 0 40px rgba(0,0,0,0.6); }
      50%  { box-shadow: 0 0 100px rgba(76,175,125,0.4), 0 0 40px rgba(0,0,0,0.4); }
      100% { box-shadow: 0 0 80px rgba(154,0,2,0.15), 0 0 40px rgba(0,0,0,0.6); }
    }

    .video-flash { animation: flash-success 0.8s ease; }

    @media(max-width: 480px) {
      .kiosk-video-wrap { width: 240px; height: 240px; }
      .scanning-ring-outer { width: 300px; height: 300px; }
      .scanning-ring-inner { width: 250px; height: 250px; }
      .scanning-arc { width: 275px; height: 275px; }
    }
  </style>
</head>
<body>
<div class="kiosk-offline" id="kiosk-offline-banner">Offline — Attendance queued locally</div>

<div class="kiosk-shell">
  <!-- Brand -->
  <div class="kiosk-header">
    <h1 class="kiosk-brand">Akriti Diagnostics</h1>
    <div class="kiosk-subtitle">Attendance Kiosk — Biometric Module Disabled</div>
  </div>

  <!-- Disabled Notice Area -->
  <div class="kiosk-status" style="max-width: 480px; text-align: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 32px 24px;">
    <div style="font-size: 40px; margin-bottom: 12px;">🔒</div>
    <div class="status-main" id="status-main" style="color: #E8F4F0; font-size: 18px; margin-bottom: 8px;">Biometric Recognition Disabled</div>
    <div class="status-sub" id="status-sub" style="color: rgba(232,244,240,0.6); font-size: 14px; line-height: 1.5;">
      Facial recognition attendance is intentionally disabled in PathLab OS. Staff attendance must be managed through authorized staff administrative check-in.
    </div>
  </div>

  <!-- Actions -->
  <div class="kiosk-actions">
    <button class="kiosk-btn kiosk-btn-primary" id="capture-btn" disabled style="opacity: 0.4; cursor: not-allowed;">Capture Disabled</button>
    <button class="kiosk-btn kiosk-btn-ghost" id="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:inline;vertical-align:middle;margin-right:4px"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Attendance
    </button>
  </div>
</div>

<div id="toast-container"></div>

<script>
  // Biometric camera access and auto-scan are intentionally disabled in PathLab OS (SEC-02, SEC-04).
  document.getElementById('back-btn').addEventListener('click', (e) => {
    e.preventDefault();
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = '/staff/attendance';
    }
  });
</script>
</body>
</html>

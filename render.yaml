services:
  - type: web
    name: akritidc
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_SERVICE_PORT
        value: "3001"
      - key: WHATSAPP_SERVICE_HOST
        value: 0.0.0.0
      - key: WHATSAPP_SERVICE_URL
        value: http://127.0.0.1:3001
